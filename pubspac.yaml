name: craftybay

description: CraftyBay Ecommerce App

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Network
  http: ^1.2.2

  # SVG
  flutter_svg: ^2.0.10+1

  # Carousel
  carousel_slider: ^5.0.0

  # Pin Code
  pin_code_fields: ^8.0.1

  # Local Storage
  shared_preferences: ^2.3.2

  # Cached Image
  cached_network_image: ^3.4.1

  # Badge
  badges: ^3.1.2

  # Read More
  readmore: ^3.0.0

  # Rating Bar
  flutter_rating_bar: ^4.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:

  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
